
<!DOCTYPE html>
<html>
<head>
    <title>Formulir HTML</title>
</head>
<body>

    <h2>Formulir Pendaftaran</h2>

    <form>

        <label for="username">Username :</label>
        <input type="text" id="username" name="username">
        <br><br>

        <label for="password">Password :</label>
        <input type="password" id="password" name="password">
        <br><br>

        <input type="radio" id="pria" name="jeniskelamin" value="pria">
        <label for="pria">pria</label>

        <input type="radio" id="wanita" name="jeniskelamin" value="wanita">
        <label for="wanita">wanita</label>
        <br><br>

        <input type="checkbox" id="menyanyi" name="hobi" value="menyanyi">
        <label for="menyanyi">menyanyi</label>

        <input type="checkbox" id="olahraga" name="hobi" value="olahraga">
        <label for="olahraga">olahraga</label>

        <input type="checkbox" id="ngoding" name="hobi" value="ngoding">
        <label for="ngoding">ngoding</label>
        <br><br>

        <textarea name="pesan"></textarea>
        <br><br>

        <select name="kota">
            <option>Bandung</option>
            <option>Yogyakarta</option>
            <option>Jakarta</option>
          <option>lagadar</option>
        </select>
        <br><br>

        <button type="confirmasi">Kirim!</button>

    </form>

</body>
</html>
